name: ExtMem Driver CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc python3

      - name: Compile and run test suite
        run: |
          make test

      - name: Driver coverage (100% of lines required)
        run: |
          make coverage

      - name: Examples compile against the driver API
        run: |
          make clean
          make examples
